# security-scan（Windows版）の設定例。無くても動く（gh / aws / vercel / gog のログイン状態から対象を自動検出する）。
# 使うときは %USERPROFILE%\.config\security-scan\config.toml にコピーして編集する。秘密値は書かない。
# Windows のパスは "C:/work/app" のように / で書くか、'C:\work\app' のように ' で囲む（" の中の \ はエスケープになる）。

[windows]
check_updates = true            # Windows Update の未適用を検索（1〜5分かかることがある）
check_acl = true                # SYSTEM 権限で動くサービス・タスクの実行ファイルの書き換え権限と署名を確認

[repos]
# 省略時は ~/dev ~/work ~/projects ~/Project ~/src ~/code ~/repos ~/git ~/source/repos と「ドキュメント\GitHub」のうち存在するもの
# roots = ["~/dev", "C:/work"]
exclude = ["/_archive/", "/node_modules/"]   # パスの区切りは / で書く（Windows でも / に揃えて照合する）
max_depth = 6
workers = 4
gitleaks = true
gitleaks_timeout = 1800
osv = true
osv_engine = "auto"            # auto: osv-scanner が起動できればそれ、だめなら内蔵（OSV.dev API に直接問い合わせ）/ builtin / osv-scanner
# gitで管理していない置き場も、作業ツリーのまま秘密情報を探す
secret_dirs = ["~/.claude/skills"]

[web]
vercel = true                   # vercel CLI にログインしていれば全チームの本番ドメインを自動で対象に入れる
include_vercel_app = false
vercel_env_detail = true
max_sites = 150
urls = []                       # Vercel 以外で公開しているサイト。例: ["example.com", "www.example.com"]
exclude = []

[aws]
regions = ["ap-northeast-1", "us-east-1"]
exclude_profiles = []

[gcp]
# account = "you@example.com"   # 省略時は gcloud の現在のアカウント
# projects = ["my-project"]     # 省略時は見える全プロジェクト（Cloud Resource Manager API が必要）
exclude_projects = []

[azure]
exclude_subscriptions = []

[cloudflare]
token_env = "CLOUDFLARE_API_TOKEN"   # 読み取り専用トークン（Zone:Read / Zone Settings:Read / DNS:Read / Account Settings:Read）

[supabase]
token_env = "SUPABASE_ACCESS_TOKEN"  # あれば Security Advisor（RLS未設定など）を読む。無ければプロジェクト一覧だけ

[gmail]
# 省略時は gog auth list で gmail を許可したアカウントを全部見る
# accounts = ["you@example.com"]
allowed_forwarding = []         # 意図して使っている転送先。ここに足すと「情報」扱いになる
alert_days = 14
